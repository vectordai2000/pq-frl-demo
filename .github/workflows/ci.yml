name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment and DDPG unit checks
        run: python tests/test_all.py

      - name: Short training run (PQ-FRL and DP-FedAvg)
        run: |
          python train.py --algo pq-frl --rounds 12 --eval-every 6 --eval-slots 20 --no-plot --out results/ci_pq
          python train.py --algo dp-fedavg --rounds 12 --eval-every 6 --eval-slots 20 --no-plot --out results/ci_dp
